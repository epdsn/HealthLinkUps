name: corelinkups
description: A cross-platform health and fitness application for sharing knowledge, community engagement, and real-world fitness activities.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # HTTP & Networking
  http: ^1.1.2
  
  # Video Player
  video_player: ^2.8.2
  youtube_player_flutter: ^8.1.2
  
  # Maps
  google_maps_flutter: ^2.5.3
  location: ^5.0.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI Enhancements
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.6.18
  url_launcher: ^6.2.3
  intl: ^0.19.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
